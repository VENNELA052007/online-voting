<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">Online Voting System</a>
    <button id="logoutButton" class="button">Logout</button>
  </header>
  <main class="page-content">
    <div class="page-heading">
      <div>
        <p class="tag">USER MODULE</p>
        <h1>Voter Dashboard</h1>
        <p id="welcomeText"></p>
      </div>
      <p id="electionStatus" class="status"></p>
    </div>
    <section class="panel">
      <h2>Choose one candidate</h2>
      <p id="voteMessage" class="message"></p>
      <form id="voteForm">
        <div id="userCandidateList" class="card-list"></div>
        <button id="voteButton" type="submit" class="button">Cast Vote</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
